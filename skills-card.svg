<svg width="800" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glass-distortion-2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.002 0.002" numOctaves="2" seed="92" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="inner-glow-blur-2"><feGaussianBlur stdDeviation="20" /></filter>
    <clipPath id="skills-clip"><rect width="780" height="200" rx="24" /></clipPath>
  </defs>

  <g transform="translate(10, 10)">
    <rect width="780" height="200" rx="24" fill="#ffffff" fill-opacity="0.05" />
    <rect width="780" height="200" rx="24" fill="#ffffff" fill-opacity="0.05" filter="url(#glass-distortion-2)" opacity="0.8" />
    <g clip-path="url(#skills-clip)">
      <rect width="780" height="200" rx="24" fill="none" stroke="#999999" stroke-opacity="0.75" stroke-width="45" filter="url(#inner-glow-blur-2)" />
    </g>
    <rect width="780" height="200" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

    <text x="35" y="45" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">⚡ Tech Stack &amp; Skills</text>

    <!-- Skill Badges Group 1: Languages -->
    <text x="35" y="82" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Languages &amp; Core</text>
    
    <rect x="35" y="95" width="100" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="85" y="116" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">JavaScript</text>

    <rect x="145" y="95" width="80" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="185" y="116" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">HTML/CSS</text>

    <rect x="235" y="95" width="80" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="275" y="116" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">Python</text>

    <rect x="325" y="95" width="70" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="360" y="116" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">C/C++</text>

    <!-- Skill Badges Group 2: Tools & Frameworks -->
    <text x="35" y="152" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Technologies &amp; Tools</text>

    <rect x="35" y="162" width="80" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="75" y="183" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">Node.js</text>

    <rect x="125" y="162" width="70" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="160" y="183" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">React</text>

    <rect x="205" y="162" width="110" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="260" y="183" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">Linux &amp; RDP</text>

    <rect x="325" y="162" width="80" height="32" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <text x="365" y="183" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">Git/GitHub</text>
  </g>
</svg>
