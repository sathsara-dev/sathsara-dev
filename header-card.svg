<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glass-distortion" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.002 0.002" numOctaves="2" seed="92" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
      <feDisplacementMap in="SourceGraphic" in2="blurred" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="inner-glow-blur"><feGaussianBlur stdDeviation="20" /></filter>
    <filter id="outer-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.2" />
    </filter>
    <clipPath id="header-clip"><rect width="780" height="180" rx="24" /></clipPath>
  </defs>

  <g transform="translate(10, 10)">
    <rect width="780" height="180" rx="24" fill="#ffffff" fill-opacity="0.05" filter="url(#outer-glow)" />
    <rect width="780" height="180" rx="24" fill="#ffffff" fill-opacity="0.05" filter="url(#glass-distortion)" opacity="0.8" />
    
    <g clip-path="url(#header-clip)">
      <rect width="780" height="180" rx="24" fill="none" stroke="#999999" stroke-opacity="0.75" stroke-width="45" filter="url(#inner-glow-blur)" />
    </g>
    <rect width="780" height="180" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

    <!-- Avatar Circle -->
    <circle cx="70" cy="90" r="38" fill="#ffffff" fill-opacity="0.08" stroke="#3b82f6" stroke-width="2" />
    <g transform="translate(50, 70)" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" transform="scale(1.6) translate(-3, -3)" />
      <circle cx="20" cy="12" r="7" />
    </g>

    <!-- Header Details -->
    <text x="135" y="75" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700">sathsara</text>
    <text x="135" y="105" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">the digital reality developer.</text>
    <text x="135" y="132" fill="#e0e6ed" fill-opacity="0.75" font-family="system-ui, -apple-system, sans-serif" font-size="13">💻 Full-Stack &amp; Systems Developer | 🚀 470+ Contributions this year</text>

    <!-- Status Badge -->
    <rect x="620" y="30" width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <circle cx="638" cy="45" r="5" fill="#22c55e" />
    <text x="650" y="49" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Available for hire</text>
  </g>
</svg>
